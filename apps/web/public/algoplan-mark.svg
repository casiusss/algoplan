<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AlgoPlan">
  <!--
    AlgoPlan brand mark (square): single source of truth for favicon, app icon,
    PWA, and OG raster generation.

    Composition: matches packages/views/auth/algoplan-wordmark.tsx. The brand
    is a filled green circle (the "dot" component of the wordmark) at full
    canvas. Background is a soft white square so the mark sits cleanly inside
    browser favicons and macOS dock badges (which would otherwise render the
    transparent region as a generic platform tile).

    Brand color: #008757 (sRGB hex of the brand token oklch(0.55 0.13 156)).
    Confirmed via packages/ui/styles/tokens.css line 99 ("brand-green").

    Re-run `node scripts/generate-brand-assets.mjs` after editing this file.
  -->
  <rect width="100" height="100" rx="20" fill="#ffffff"/>
  <circle cx="50" cy="50" r="34" fill="#008757"/>
</svg>

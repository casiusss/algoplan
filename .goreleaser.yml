version: 2

# Phase 8 D-6 (2026-04-27): Homebrew publish is DEFERRED for v0.5.0.
# The legacy multica-ai/homebrew-tap is read-only for this fork.
# When an algoplan-ai org or fork-owned tap exists, restore a brews block
# targeting it. Until then, users install via:
#   - go install github.com/multica-ai/multica/server/cmd/algoplan@latest
#   - Download release binaries from the GitHub Releases page

project_name: algoplan

builds:
  - id: algoplan
    main: ./cmd/algoplan
    dir: server
    binary: algoplan
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Versioned archive name used by CLI / install scripts / desktop bootstrap.
  # Renders as algoplan-cli-<version>-<os>-<arch>.
  - id: versioned
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
